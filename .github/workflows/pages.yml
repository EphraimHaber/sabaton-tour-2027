name: Deploy trip page to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "ui/**"
      - "*/flights.md"
      - "*/sightseeing.md"
      - "*/sources.md"
      - "*/sightseeing-sources.md"
      - "*/fact-check.md"
      - "dublin/data/itineraries.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # build.py uses the standard library only; no dependency install needed.
      - name: Build page
        run: python ui/build.py --site _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
